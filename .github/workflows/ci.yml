name: CI

"on":
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Run physics tests
        run: python -m unittest discover -v

      - name: Run PAN mock demo
        run: PYTHONPATH=. python3 -m pan demo --backend mock --frames 3 --steps 1 --out out/pan_demo

      - name: Upload PAN demo output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pan-demo
          path: |
            out/pan_demo/summary.txt
            out/pan_demo/comparison.png
          if-no-files-found: warn

  swift:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1"

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: swift/PackPhysics/.build
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('swift/PackPhysics/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-

      - name: Build
        working-directory: swift/PackPhysics
        run: swift build -c release

      - name: Test
        working-directory: swift/PackPhysics
        run: swift test

      - name: Run packphysics bench (if present)
        working-directory: swift/PackPhysics
        run: |
          if swift package describe --type json | grep -q '"packphysics"'; then
            swift run -c release packphysics bench
          else
            echo "packphysics executable not present yet; skipping bench"
          fi
