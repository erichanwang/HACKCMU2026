name: CI

"on":
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install -r requirements.txt

      # The server deps too, BEFORE discover: tests/test_server_contract.py raises SkipTest
      # without them, and a silent skip in the default suite is how five unauthenticated GET
      # routes reached main with CI green. They were installed further down for the server
      # check, which ran too late to make discover cover them.
      - name: Install server deps so the server contract tests are not skipped
        run: pip install fastapi uvicorn pymongo httpx python-multipart mongomock "python-jose[cryptography]"

      - name: Run physics tests
        run: python -m unittest discover -v

      - name: Run PAN mock demo
        run: PYTHONPATH=. python3 -m pan demo --backend mock --frames 3 --steps 1 --out out/pan_demo

      - name: Run packer3d tests
        working-directory: packer3d
        # The whole suite, timing tests included: the 1000-item case runs in ~13 s since the
        # decoder fix, so nothing is marked slow any more.
        run: |
          pip install pytest
          PYTHONPATH=. python -m pytest -q tests/

      - name: Server check
        working-directory: server
        run: |
          pip install fastapi uvicorn pymongo httpx python-multipart numpy mongomock "python-jose[cryptography]"
          python check.py

      - name: Upload PAN demo output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pan-demo
          path: |
            out/pan_demo/summary.txt
            out/pan_demo/comparison.png
          if-no-files-found: warn

  swift:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1"

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: swift/PackPhysics/.build
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('swift/PackPhysics/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-

      - name: Build
        working-directory: swift/PackPhysics
        run: swift build -c release

      - name: Test
        working-directory: swift/PackPhysics
        run: swift test

      - name: Run packphysics bench (if present)
        working-directory: swift/PackPhysics
        run: |
          if swift package describe --type json | grep -q '"packphysics"'; then
            swift run -c release packphysics bench
          else
            echo "packphysics executable not present yet; skipping bench"
          fi

      - name: Run tests/swift/*/run.sh (if any)
        run: |
          for f in tests/swift/*/run.sh; do
            [ -e "$f" ] || continue
            echo "running $f"
            bash "$f"
          done

      - name: Plan contract (server plan through the real Swift decoder)
        run: |
          pip install -r requirements.txt
          bash tests/plan_contract/run.sh
