[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "packer3d"
version = "0.1.0"
description = "3D packing of boxes & cylinders with centre-of-mass optimisation"
requires-python = ">=3.9"
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
dev = ["pytest", "matplotlib"]

[tool.setuptools]
packages = ["packer3d"]

[tool.pytest.ini_options]
markers = ["slow: takes 60s+, excluded from the default run (see FIXES.md #2)"]
