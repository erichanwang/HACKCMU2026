name: Spike
options:
  # Bundle IDs are globally unique across every Apple developer account, and the
  # generic `com.suitcase` prefix was already registered by someone else, so Apple
  # refused to issue a provisioning profile. Anything account-specific works.
  bundleIdPrefix: com.aaravlala.h9579fb9e
  deploymentTarget:
    iOS: "17.0"
packages:
  PackingPlan:
    path: packing-core
targets:
  Spike:
    type: application
    platform: iOS
    sources: [Spike]
    dependencies:
      - package: PackingPlan
        product: PackingPlan
      - package: PackingPlan
        product: PackingPlanUI
    info:
      path: Spike/Info.plist
      properties:
        NSCameraUsageDescription: Measures objects with the LiDAR camera.
        UIRequiredDeviceCapabilities: [arkit]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppTransportSecurity: { NSAllowsLocalNetworking: true }
        NSLocalNetworkUsageDescription: Sends scans to the packing server running on your Mac.
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        # Set here rather than in Xcode's UI, because `xcodegen generate` rewrites the
        # project and would discard a team picked in the Signing tab.
        DEVELOPMENT_TEAM: 9559NN4M97
