name: Spike
options:
  bundleIdPrefix: com.suitcase
  deploymentTarget:
    iOS: "17.0"
packages:
  PackingPlan:
    path: packing-core
  PackPhysics:
    path: swift/PackPhysics
targets:
  Spike:
    type: application
    platform: iOS
    sources: [Spike]
    dependencies:
      - package: PackingPlan
        product: PackingPlan
      - package: PackingPlan
        product: PackingPlanUI
      - package: PackPhysics
        product: PackPhysics
    info:
      path: Spike/Info.plist
      properties:
        NSCameraUsageDescription: Measures objects with the LiDAR camera.
        UIRequiredDeviceCapabilities: [arkit]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppTransportSecurity: { NSAllowsLocalNetworking: true }
        NSLocalNetworkUsageDescription: Sends scans to the packing server running on your Mac.
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.aaravlala.suitcase.spike2026
        DEVELOPMENT_TEAM: GVWSS8DC98
