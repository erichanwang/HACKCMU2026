[project]
name = "suitcase-server"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi", "uvicorn",
    "pymongo",
    "dnspython",  # required by mongodb+srv:// Atlas URIs (pymongo dropped the [srv] extra)
    "httpx", "python-multipart", "numpy>=1.22",
    "python-dotenv",  # loads .env.local
]
